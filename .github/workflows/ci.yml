name: CI

on:
  push:
    branches: [main, "chore/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight backend test dependencies
        run: python -m pip install --upgrade pip pytest "pydantic==2.8.2" "pydantic-settings==2.3.4" "sqlalchemy==2.0.31" "email-validator==2.2.0"
      - name: Run unit tests
        run: python -m pytest tests -q
      - name: Compile backend modules
        run: python -m compileall -q app scripts

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
