name: CI

on:
  push:
    branches: [main, "chore/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migration verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eduai_test
          POSTGRES_USER: eduai_test
          POSTGRES_PASSWORD: eduai_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduai_test -d eduai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "false"
      SECRET_KEY: test-only-secret-key
      DATABASE_URL: postgresql://eduai_test:eduai_test_password@localhost:5432/eduai_test
      JWT_SECRET_KEY: test-only-jwt-secret
      GOOGLE_API_KEY: test-only-google-key
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-cloudinary-key
      CLOUDINARY_API_SECRET: test-cloudinary-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight backend test dependencies
        run: python -m pip install --upgrade pip pytest "pydantic==2.8.2" "pydantic-settings==2.3.4" "python-dotenv==1.0.1" "sqlalchemy==2.0.31" "email-validator==2.2.0" "cryptography==42.0.8" "alembic==1.13.1" "psycopg2-binary==2.9.9"
      - name: Run unit tests
        run: python -m pytest tests -q
      - name: Apply schema migration to PostgreSQL
        run: python -m alembic upgrade head
      - name: Compare migrated schema with SQLAlchemy models
        run: python -m alembic check
      - name: Compile backend modules
        run: python -m compileall -q app scripts alembic

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
